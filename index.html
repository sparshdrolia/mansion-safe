<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAFE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151515;
            font-family: monospace;
        }

        .safe {
            width: min(90vw, 380px);
            padding: 35px 25px;
            background: #252525;
            border: 3px solid #444;
            border-radius: 12px;
            box-shadow:
                0 0 0 6px #181818,
                0 15px 40px rgba(0,0,0,0.7);
            text-align: center;
        }

        .title {
            color: #aaa;
            font-size: 18px;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .display {
            width: 100%;
            padding: 18px 10px;
            background: #080808;
            border: 2px solid #555;
            border-radius: 5px;
            color: #ddd;
            font-size: 38px;
            letter-spacing: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            font-family: monospace;
            color: #ddd;
            background: #333;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
        }

        button:active {
            background: #555;
            transform: scale(0.97);
        }

        .clear {
            grid-column: span 3;
            height: 45px;
            font-size: 16px;
            margin-top: 5px;
        }

        #status {
            margin-top: 22px;
            font-size: 20px;
            letter-spacing: 3px;
            color: #d44;
        }

        #status.unlocked {
            color: #55d66b;
        }
    </style>
</head>

<body>

<div class="safe">

    <div class="title">SECURITY LOCK</div>

    <div id="display" class="display">---</div>

    <div class="keypad">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>

        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>

        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>

        <button onclick="press(0)">0</button>

        <button class="clear" onclick="clearCode()">CLEAR</button>
    </div>

    <div id="status">LOCKED</div>

</div>

<script>

let code = "";

function press(number) {

    if (code.length >= 3) {
        return;
    }

    code += number;

    updateDisplay();

    if (code === "937") {
        document.getElementById("status").textContent = "UNLOCKED";
        document.getElementById("status").classList.add("unlocked");
    } else {
        document.getElementById("status").textContent = "LOCKED";
        document.getElementById("status").classList.remove("unlocked");
    }
}

function clearCode() {

    code = "";

    updateDisplay();

    document.getElementById("status").textContent = "LOCKED";
    document.getElementById("status").classList.remove("unlocked");
}

function updateDisplay() {

    let display = "";

    for (let i = 0; i < 3; i++) {
        if (i < code.length) {
            display += code[i];
        } else {
            display += "-";
        }
    }

    document.getElementById("display").textContent = display;
}

</script>

</body>
</html>
